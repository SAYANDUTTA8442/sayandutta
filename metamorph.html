<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metamorph - Redirecting...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050508;
      color: #f3f4f6;
      overflow: hidden;
    }

    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Ambient pulse background */
    .glow-bg {
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.1) 40%, rgba(5, 5, 8, 0) 70%);
    }

    /* Glassmorphism styling */
    .glass-card {
      background: rgba(15, 15, 26, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Glowing text gradient */
    .gradient-text {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* SVG Ring Progress Animation */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center p-4 selection:bg-purple-500 selection:text-white">

  <div id="canvas-container" class="absolute inset-0 z-0"></div>
  <div class="glow-bg absolute inset-0 pointer-events-none z-0"></div>

  <main class="relative z-10 w-full max-w-md glass-card rounded-3xl p-8 sm:p-10 text-center flex flex-col items-center justify-between min-h-[480px]">
    
    <!-- Top Header & Branding -->
    <div class="w-full flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-ping"></div>
        <span class="text-xs uppercase tracking-widest text-purple-400 font-semibold">Metamorphosis</span>
      </div>
      <!-- <span class="text-xs text-gray-400 font-mono bg-white/5 px-2.5 py-1 rounded-full border border-white/10">3D Tunneled Loop</span> -->
    </div>

    <!-- Center Morph Animation Timer Ring -->
    <div class="relative my-6 flex items-center justify-center">
      <!-- SVG Progress Ring -->
      <svg class="w-36 h-36 relative z-10">
        <circle class="text-gray-800/60" stroke-width="4" stroke="currentColor" fill="transparent" r="62" cx="72" cy="72"/>
        <circle id="progress-circle" class="progress-ring__circle text-purple-500" stroke-width="4" stroke-dasharray="389.5" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="62" cx="72" cy="72"/>
      </svg>

      <!-- Center Countdown Display -->
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center z-20">
        <span id="countdown-num" class="font-display text-4xl font-bold tracking-tight text-white drop-shadow-[0_0_12px_rgba(168,85,247,0.5)]">5</span>
        <span class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Seconds</span>
      </div>
    </div>

    <!-- Redirection Info -->
    <div class="space-y-2 w-full">
      <h1 class="font-display text-2xl sm:text-3xl font-bold tracking-tight text-white">
        Redirecting to <span class="gradient-text">Sayan Dutta</span>
      </h1>
      <p class="text-xs sm:text-sm text-gray-400 max-w-xs mx-auto leading-relaxed">
        Hold tight! Traveling through the tunnel loop and redirecting you to the portfolio.
      </p>
    </div>

    <!-- Action Link / Manual Redirect -->
    <div class="w-full mt-6 pt-4 border-t border-white/10">
      <a id="redirect-btn" href="https://sayandutta.netlify.app" class="group relative inline-flex items-center justify-center w-full py-3 px-6 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-sm shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
        <span>Click here if not redirected</span>
        <svg class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </a>
      <p class="text-[11px] text-gray-500 mt-2 font-mono">https://sayandutta.netlify.app</p>
    </div>

  </main>

  <script>
    const TARGET_URL = "https://sayandutta.netlify.app";
    const DURATION = 5000; // 5 seconds
    const startTime = Date.now();

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.08); // Depth fog for realistic tunnel perspective

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const PARTICLE_COUNT = 4500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const originalAngles = new Float32Array(PARTICLE_COUNT);
    const originalRadii = new Float32Array(PARTICLE_COUNT);
    const zPositions = new Float32Array(PARTICLE_COUNT);

    const TUNNEL_LENGTH = 35;
    const TUNNEL_RADIUS = 2.4;

    const color1 = new THREE.Color(0xa855f7); // Purple
    const color2 = new THREE.Color(0x3b82f6); // Blue
    const color3 = new THREE.Color(0xec4899); // Pink
    const color4 = new THREE.Color(0x06b6d4); // Cyan

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const angle = Math.random() * Math.PI * 2;
      const radius = TUNNEL_RADIUS + (Math.random() - 0.5) * 1.4;
      const z = (Math.random() - 0.5) * TUNNEL_LENGTH;

      originalAngles[i] = angle;
      originalRadii[i] = radius;
      zPositions[i] = z;

      positions[i3] = Math.cos(angle) * radius;
      positions[i3 + 1] = Math.sin(angle) * radius;
      positions[i3 + 2] = z;

      // Color gradient distribution through tunnel depth
      const t = (z + TUNNEL_LENGTH / 2) / TUNNEL_LENGTH;
      const mixedColor = color1.clone().lerp(color2, t).lerp(color3, Math.sin(angle * 3) * 0.5 + 0.5);
      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(32, 32, 32, 0, Math.PI * 2);
    ctx.fill();

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      map: texture,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    let mouseX = 0;
    let mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
    });

    const countdownEl = document.getElementById('countdown-num');
    const circle = document.getElementById('progress-circle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    let redirected = false;

    function triggerRedirect() {
      if (redirected) return;
      redirected = true;
      window.location.href = TARGET_URL;
    }

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = Date.now() - startTime;
      const progress = Math.min(elapsedTime / DURATION, 1);
      const remainingTime = Math.max(0, Math.ceil((DURATION - elapsedTime) / 1000));

      countdownEl.innerText = remainingTime;
      const offset = circumference - (progress * circumference);
      circle.style.strokeDashoffset = offset;

      // Infinite Tunneled Flight Math
      const speed = 0.18;
      const time = Date.now() * 0.0025;
      const posArr = geometry.attributes.position.array;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        // Move particle forward toward viewer
        zPositions[i] += speed;

        // Seamless Infinite Tunnel Looping Wrap
        if (zPositions[i] > 4) {
          zPositions[i] -= TUNNEL_LENGTH;
        }

        const currentZ = zPositions[i];
        
        // Wave form twist deformations along tunnel length
        const tunnelWaveX = Math.sin(currentZ * 0.18 + time) * 0.8;
        const tunnelWaveY = Math.cos(currentZ * 0.18 + time) * 0.8;

        const twist = currentZ * 0.08 + time * 0.6;
        const angle = originalAngles[i] + twist;
        const r = originalRadii[i] + Math.sin(time * 2 + currentZ * 0.3) * 0.25;

        posArr[i3] = Math.cos(angle) * r + tunnelWaveX;
        posArr[i3 + 1] = Math.sin(angle) * r + tunnelWaveY;
        posArr[i3 + 2] = currentZ;
      }

      geometry.attributes.position.needsUpdate = true;

      // Camera dynamic sway and axial tunnel rotation
      particleSystem.rotation.z = time * 0.08;
      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);

      if (elapsedTime >= DURATION && !redirected) {
        triggerRedirect();
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
